<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas | FastAPI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4">
        
        <h3 class="fw-bold text-primary mb-4 text-center">
          <i class="fa-solid fa-bolt me-2"></i>Mis Tareas en FastAPI
        </h3>

        <!-- Formulario para agregar tarea -->
        <form action="/agregar" method="POST" class="d-flex gap-2 mb-4">
          <input type="text" name="titulo" class="form-control form-control-lg rounded-3" placeholder="¿Qué hay que hacer hoy?" required>
          <button type="submit" class="btn btn-primary btn-lg rounded-3 px-4">
            <i class="fa-solid fa-plus"></i>
          </button>
        </form>

        <!-- Lista de tareas -->
        <div class="list-group list-group-flush">
          {% for tarea in tareas %}
            <div class="list-group-item d-flex justify-content-between align-items-center py-3 border-0 bg-light rounded-3 mb-2">
              <span class="fs-6 fw-medium text-dark">
                <i class="fa-regular fa-circle-check text-muted me-2"></i>{{ tarea.titulo }}
              </span>
              <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">
                Activa
              </span>
            </div>
          {% else %}
            <p class="text-center text-muted my-3">No hay tareas pendientes. ¡Añade una arriba!</p>
          {% endfor %}
        </div>

      </div>
    </div>
  </div>

</body>
</html>
